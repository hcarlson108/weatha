<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Weatha</h1>
    <p>(you like it or not)</p>
    <input type="text" id="search-input" placeholder="Search for a city" />
    <div><button id="search-button">Search</button></div>
    <p id="loading" hidden>Loading…</p>
    <section id="current" hidden>
      <h2 id="current-city"></h2>
      <p id="current-temp"></p>
      <p id="current-condition"></p>
      <p id="current-wind"></p>
    </section>

    <section id="forecast"></section>

    <script src="app.js"></script>
  </body>
</html>
