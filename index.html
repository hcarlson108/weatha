<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Weatha</h1>
    <p id="slogan">(you like it or not)</p>
    <input type="text" id="search-input" placeholder="Search for a city" />
    <div><button id="search-button">Search</button></div>
    <p id="loading" hidden>Loading…</p>
    <section id="current" hidden>
      <h2 id="current-city"></h2>
      <p id="current-temp"></p>
      <p id="current-condition"></p>
      <p id="current-wind"></p>
    </section>

    <section id="forecast"></section>

    <footer id="footer">
      <p>Website made by <a href="https://github.com/hcarlson108" target="_blank" rel="noopener noreferrer">hcarlson108</a>, all rights reserved</p>
      <p>Weather data provided by <a href="https://open-meteo.com" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
